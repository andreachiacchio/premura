# Ping di verifica Fly -> Tailscale -> WAHA -> WhatsApp: esegue il
# sendText di test DAL worker (send-test-message.ts passa dal transport,
# quindi rispetta kill switch e dry-run — non puo' aggirare i paracadute).
#
# Si lancia in due modi:
#  - workflow_dispatch (bottone "Run workflow" per Andrea)
#  - push su main che tocca .github/fly-ping-request.txt (la via della
#    sessione Claude, che non ha il permesso di dispatch: bump del file
#    in un PR, il merge fa partire il ping)
#
# Il retry copre il caso "merge che fa ripartire anche il deploy":
# durante il rollout le macchine si riavviano e ssh puo' fallire.

name: Fly ping WAHA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/fly-ping-request.txt']

concurrency:
  group: fly-ping
  cancel-in-progress: false

jobs:
  ping:
    name: ping dal worker
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # UN tentativo, MAI retry: flyctl ssh esce con codice != 0 anche a
      # messaggio partito, e il retry del run #1 ha mandato 5 ping in 5
      # minuti al founder (incidente 30/07). L'esito vero si legge dai
      # marker dello script; se manca, si indaga — non si rimanda.
      - name: sendText "Premura è online" al founder (singolo, senza retry)
        run: |
          out=$(flyctl ssh console --app premura-api-staging --process-group worker -C "pnpm exec tsx src/scripts/send-test-message.ts +393383963307 Premura è online" 2>&1) || true
          echo "$out"
          echo "$out" | grep -q "\[test-send\] \(INVIATO\|SIMULATO\|BLOCCATO\)" || {
            echo "::error::Nessun esito dallo script: NON riprovare alla cieca, leggere i log."
            exit 1
          }

      - name: Log recenti del worker (evidenza cron e webhook)
        if: always()
        run: flyctl logs --app premura-api-staging --no-tail
