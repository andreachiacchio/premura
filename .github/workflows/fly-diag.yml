# Diagnostica SOLA LETTURA dell'app Fly: secrets (solo nomi e digest,
# mai valori), stato macchine, health del worker e log recenti.
#
# Serve quando dal di fuori (Vercel, DB) un cron del worker risulta muto
# e bisogna capire da che lato e' il problema senza accesso flyctl
# diretto. Nessun comando muta stato: niente deploy, niente restart,
# niente secrets set.
#
# Si lancia in due modi (stesso pattern di fly-ping):
#  - workflow_dispatch (bottone per Andrea)
#  - push su main che tocca .github/fly-diag-request.txt (la via della
#    sessione Claude: bump del file in un PR, il merge fa partire il run)

name: Fly diagnostica

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/fly-diag-request.txt']

concurrency:
  group: fly-diag
  cancel-in-progress: false

jobs:
  diag:
    name: stato worker (sola lettura)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Secrets configurate (nomi e digest, mai valori)
        run: flyctl secrets list --app premura-api-staging || true

      - name: Stato macchine (process group e ultimo aggiornamento)
        run: flyctl machine list --app premura-api-staging || true

      # UN tentativo, mai retry (lezione fly-ping 30/07): flyctl ssh puo'
      # uscire con codice != 0 anche a comando riuscito.
      - name: Health del worker (cron schedulati)
        run: |
          out=$(flyctl ssh console --app premura-api-staging --process-group worker -C "wget -qO- http://localhost:8080/health" 2>&1) || true
          echo "$out"

      - name: Log recenti (cercare gmail-sync-cron)
        run: flyctl logs --app premura-api-staging --no-tail || true

      # VERDETTO IN CODA, non in cima. `flyctl logs` sputa centinaia di
      # righe di health check, e le API che rileggono questo log danno
      # solo la coda: una risposta stampata al primo step diventa
      # illeggibile da fuori. Quello che serve sapere sta in fondo.
      # Solo NOMI, mai valori: `secrets list` non li espone e qui si
      # guarda esclusivamente la prima colonna.
      - name: Verdetto — secrets che governano gli invii (solo nomi)
        run: |
          names=$(flyctl secrets list --app premura-api-staging 2>/dev/null | awk 'NR>1 {print $1}')
          echo "=== SECRETS INVII (nome, mai valore) ==="
          for k in WHATSAPP_KILL_SWITCH WHATSAPP_DRY_RUN WAHA_BASE_URL WAHA_SESSION WAHA_API_KEY; do
            if printf '%s\n' "$names" | grep -qx -- "$k"; then
              echo "$k: IMPOSTATA"
            else
              echo "$k: NON impostata (vale il default del codice)"
            fi
          done
          echo
          echo "=== MODALITA INVIO, CHIESTA ADESSO AL WORKER ==="
          # Fonte primaria: /health del worker risponde con lo stato
          # corrente, chiamando le stesse funzioni dei mittenti. Non
          # dipende da nessuna finestra di log — la domanda si fa quando
          # serve. Solo la conclusione, mai i valori delle secret.
          health=$(flyctl ssh console --app premura-api-staging --process-group worker \
            -C "wget -qO- http://localhost:8080/health" 2>/dev/null) || true
          modo=$(printf '%s' "$health" | tr ',' '\n' | grep -E '"(killSwitch|dryRun|modo)"' || true)
          if [ -n "$modo" ]; then
            printf '%s\n' "$modo"
          else
            echo "worker non raggiungibile, oppure /health non espone ancora 'invii'"
          fi

          echo
          echo "=== QUANDO E' RIPARTITO IL WORKER (LAST UPDATED) ==="
          # Serve a distinguere "non e' ripartito" da "e' ripartito ma
          # il log e' scaduto": senza, le due cose si confondono.
          flyctl machine list --app premura-api-staging 2>/dev/null \
            | awk '/worker/ {print "worker aggiornato: " $(NF-3)}' || true

          echo
          echo "=== RIGA DI AVVIO, SE ANCORA NELLA FINESTRA DI LOG ==="
          # L'API stampa killSwitch/dryRun/invii al boot chiamando le
          # stesse funzioni dei mittenti. La riga esce fra i log
          # dell'app, sepolta sotto centinaia di health check: qui la si
          # ripesca e la si porta in coda, dove e' leggibile da fuori.
          boot=$(flyctl logs --app premura-api-staging --no-tail 2>/dev/null \
            | grep 'modalita invio WhatsApp' | tail -1)
          if [ -n "$boot" ]; then
            echo "$boot"
          else
            echo "nessuna riga di avvio nella finestra di log disponibile"
            echo "(l'API non si e' riavviata di recente, oppure il deploy e' anteriore al log)"
          fi
          echo "=== FINE VERDETTO ==="
