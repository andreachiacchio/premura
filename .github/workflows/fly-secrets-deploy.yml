# Applica le secrets in stato "Staged" alle macchine Fly (autorizzato
# da Andrea, 30/07): `fly secrets set --stage` (o l'equivalente da
# dashboard) lascia la secret staged e le macchine non la vedono mai —
# e' successo con GMAIL_SYNC_CRON_SECRET, col cron Gmail che saltava
# ogni tick per "secret non configurato".
#
# `fly secrets deploy` rilascia le staged e riavvia le macchine: i cron
# si riarmano da soli al boot, nessun dato perso. UN tentativo, mai
# retry (lezione fly-ping 30/07).
#
# Si lancia in due modi (stesso pattern di fly-ping/fly-diag):
#  - workflow_dispatch (bottone per Andrea)
#  - push su main che tocca .github/fly-secrets-deploy-request.txt

name: Fly secrets deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/fly-secrets-deploy-request.txt']

concurrency:
  group: fly-secrets-deploy
  cancel-in-progress: false

jobs:
  deploy-secrets:
    name: rilascia secrets staged
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: fly secrets deploy (singolo, senza retry)
        run: flyctl secrets deploy --app premura-api-staging

      - name: Verifica stato secrets (nomi e digest, mai valori)
        if: always()
        run: flyctl secrets list --app premura-api-staging || true
